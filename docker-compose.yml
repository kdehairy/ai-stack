services:

  # Model - Reasoner
  llama:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        LLAMA_VERSION: ${LLAMA_VERSION}
        AI_UID: ${AI_UID}
        AI_GID: ${AI_GID}
    image: llama-cpp-rocm:latest
    pull_policy: never
    container_name: llama
    restart: unless-stopped
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - video
      - render
    volumes:
      - ${LLAMA_MODEL_PATH}:/data/models/llamacpp:ro
    ports:
      - "${LLAMA_HOST}:${LLAMA_PORT}:8080"
    environment:
      - ROCR_VISIBLE_DEVICES=${GPU_DEVICE_IDX}
    command: >
      --models-preset /data/models/llamacpp/models.ini
      --host 0.0.0.0
      --port 8080
      --models-max 1
      --metrics
      -fa 1
      --parallel 1
      --jinja
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Model - Embedding
  llama-embedding:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        LLAMA_VERSION: ${LLAMA_VERSION}
        AI_UID: ${AI_UID}
        AI_GID: ${AI_GID}
    image: llama-cpp-rocm:latest
    pull_policy: never
    container_name: llama-embedding
    restart: unless-stopped
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - video
      - render
    volumes:
      - ${LLAMA_MODEL_PATH}:/data/models/llamacpp:ro
    ports:
      - "${EMBEDDING_HOST}:${EMBEDDING_PORT}:8080"
    environment:
      - ROCR_VISIBLE_DEVICES=${GPU_DEVICE_IDX}
    command: >
      --model /data/models/llamacpp/qwen-embedding/Qwen3-Embedding-4B-Q4_K_M.gguf
      --host 0.0.0.0
      --port 8080
      --metrics
      --embedding
      --pooling last
      -ub 8192
      --n-gpu-layers 0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # SearxNG
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    user: "${AI_UID}:${AI_GID}"
    volumes:
      - ${VOLUMES_BASE}/searxng/config:/etc/searxng:ro
    ports:
      - "${SEARXNG_HOST}:${SEARXNG_PORT}:8080"
    dns:
      - 1.1.1.1
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # OpenWebUI
  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: openwebui
    restart: unless-stopped
    volumes:
      - openwebui-data:/app/backend/data
    ports:
      - "${OPENWEBUI_HOST}:${OPENWEBUI_PORT}:8080"
    environment:
      - OPENAI_API_BASE_URL=http://llama:8080/v1
      - OPENAI_API_KEY=none
      - CORS_ALLOW_ORIGIN=http://darwish.cloud.home
      - ENABLE_WEB_SEARCH=True
      - WEB_SEARCH_ENGINE="searxng"
      - WEB_SEARCH_RESULT_COUNT=3
      - WEB_SEARCH_CONCURRENT_REQUESTS=10
      - SEARXNG_QUERY_URL="http://searxng:8080/search?q=<query>"
    depends_on:
      llama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    environment:
      - QDRANT__TELEMETRY_DISABLED=true
    ports:
      - "${QDRANT_HOST}:${QDRANT_PORT}:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

  # Qdrant MCP Server
  qdrant-mcp:
    build:
      context: embedding
      dockerfile: Dockerfile
    container_name: qdrant-mcp
    restart: unless-stopped
    depends_on:
      - qdrant
      - llama-embedding
    environment:
      TRANSPORT_MODE: http
      HTTP_PORT: 3000
      QDRANT_URL: http://qdrant:6333
      EMBEDDING_PROVIDER: openai
      EMBEDDING_BASE_URL: http://llama-embedding:8080/v1
      OPENAI_BASE_URL: http://llama-embedding:8080/v1
      EMBEDDING_MODEL: qwen3-embedding-4b
      EMBEDDING_DIMENSIONS: 2560
      OPENAI_API_KEY: dummy
      CODE_CHUNK_SIZE: 2500
      CODE_CHUNK_OVERLAP: 300
      CODE_BATCH_SIZE: 64
    ports:
      - ${QDRANT_MCP_HOST}:${QDRANT_MCP_PORT}:3000
    volumes:
      - /home/kdehairy/git_tree:/home/kdehairy/git_tree:ro
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/mcp" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Node Exporter
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    pid: host
    network_mode: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
      - --no-collector.xfs
  
  # AMD Device Metrics Exporter
  amd-device-metrics:
    image: rocm/device-metrics-exporter:v1.1.0
    container_name: amd-device-metrics
    restart: unless-stopped
    network_mode: host
    devices:
      - /dev/dri:/dev/dri
      - /dev/kfd:/dev/kfd

volumes:
  openwebui-data:
    driver: local
  qdrant_storage:
    driver: local
