source s_nginx_access_openwebui {
    file("/var/log/nginx/openwebui_access.json"
        follow-freq(1)                              # poll interval in seconds
        flags(no-parse)                             # treat each line as raw MESSAGE; skip syslog header parsing
        program-override("nginx.access.openwebui")  # sets APP-NAME in the RFC 5424 envelope; used by fluent-bit to route records
        default-facility(local7)                    # facility written into PRI when the raw line has none
        default-priority(info)                      # severity written into PRI when the raw line has none
    );
};

source s_nginx_access_llama {
    file("/var/log/nginx/llama_access.json"
        follow-freq(1)
        flags(no-parse)
        program-override("nginx.access.llama")
        default-facility(local7)
        default-priority(info)
    );
};

source s_nginx_access_searxng {
    file("/var/log/nginx/searxng_access.json"
        follow-freq(1)
        flags(no-parse)
        program-override("nginx.access.searxng")
        default-facility(local7)
        default-priority(info)
    );
};

log { source(s_nginx_access_openwebui);      destination(d_fluent_bit); };
log { source(s_nginx_access_llama);          destination(d_fluent_bit); };
log { source(s_nginx_access_searxng);        destination(d_fluent_bit); };
