destination d_fluent_bit {
    syslog("cloud.home"
        transport("tcp")  # RFC 6587 TCP with octet-count framing; produces RFC 5424 messages
        port(514)         # fluent-bit syslog listener (host-published FLUENT_BIT_PORT)
        frac-digits(3)    # always include milliseconds so the RFC 5424 time parser matches %L
    );
};

