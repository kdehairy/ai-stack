source s_nginx_error_openwebui {
    file("/var/log/nginx/openwebui_error.log"
        follow-freq(1)                             # poll interval in seconds
        flags(no-parse)                            # treat each line as raw MESSAGE; skip syslog header parsing
        program-override("nginx.error.openwebui")  # sets APP-NAME in the RFC 5424 envelope; used by fluent-bit to route records
        default-facility(local7)                   # facility written into PRI when the raw line has none
        default-priority(err)                      # severity written into PRI when the raw line has none
    );
};

source s_nginx_error_embedding {
    file("/var/log/nginx/embedding_error.log"
        follow-freq(1)
        flags(no-parse)
        program-override("nginx.error.embedding")
        default-facility(local7)
        default-priority(err)
    );
};

source s_nginx_error_llama {
    file("/var/log/nginx/llama_error.log"
        follow-freq(1)
        flags(no-parse)
        program-override("nginx.error.llama")
        default-facility(local7)
        default-priority(err)
    );
};

source s_nginx_error_searxng {
    file("/var/log/nginx/searxng_error.log"
        follow-freq(1)
        flags(no-parse)
        program-override("nginx.error.searxng")
        default-facility(local7)
        default-priority(err)
    );
};

log { source(s_nginx_error_openwebui);      destination(d_fluent_bit); };
log { source(s_nginx_error_embedding);      destination(d_fluent_bit); };
log { source(s_nginx_error_llama);          destination(d_fluent_bit); };
log { source(s_nginx_error_searxng);        destination(d_fluent_bit); };
