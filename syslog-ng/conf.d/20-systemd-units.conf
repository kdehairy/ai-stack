# Reuses s_local (defined in the base syslog-ng.conf as system() + internal()) instead of
# declaring a second systemd-journal() source: syslog-ng only allows one journal reader per
# namespace, and system() already instantiates one on the default '*' namespace.
# SYSLOG_IDENTIFIER -> $PROGRAM, MESSAGE -> $MSG, PRIORITY -> severity.

filter f_journal_llama               { program("llama"); };
filter f_journal_openwebui           { program("openwebui"); };
filter f_journal_searxng             { program("searxng"); };
filter f_journal_node_exporter       { program("node-exporter"); };
filter f_journal_amd_device_metrics  { program("amd-device-metrics"); };
filter f_journal_one_search_mcp      { program("one-search-mcp"); };
filter f_journal_grafana_mcp         { program("grafana-mcp"); };

rewrite r_journal_llama {
    set("systemd.llama", value("PROGRAM"));
    set-facility(local7);
};

rewrite r_journal_openwebui {
    set("systemd.openwebui", value("PROGRAM"));
    set-facility(local7);
};

rewrite r_journal_searxng {
    set("systemd.searxng", value("PROGRAM"));
    set-facility(local7);
};

rewrite r_journal_node_exporter {
    set("systemd.node-exporter", value("PROGRAM"));
    set-facility(local7);
};

rewrite r_journal_amd_device_metrics {
    set("systemd.amd-device-metrics", value("PROGRAM"));
    set-facility(local7);
};

rewrite r_journal_one_search_mcp {
    set("systemd.one-search-mcp", value("PROGRAM"));
    set-facility(local7);
};

rewrite r_journal_grafana_mcp {
    set("systemd.grafana-mcp", value("PROGRAM"));
    set-facility(local7);
};

log { source(s_local); filter(f_journal_llama);              rewrite(r_journal_llama);              destination(d_fluent_bit); };
log { source(s_local); filter(f_journal_openwebui);          rewrite(r_journal_openwebui);          destination(d_fluent_bit); };
log { source(s_local); filter(f_journal_searxng);             rewrite(r_journal_searxng);            destination(d_fluent_bit); };
log { source(s_local); filter(f_journal_node_exporter);       rewrite(r_journal_node_exporter);      destination(d_fluent_bit); };
log { source(s_local); filter(f_journal_amd_device_metrics);  rewrite(r_journal_amd_device_metrics); destination(d_fluent_bit); };
log { source(s_local); filter(f_journal_one_search_mcp);      rewrite(r_journal_one_search_mcp);     destination(d_fluent_bit); };
log { source(s_local); filter(f_journal_grafana_mcp);         rewrite(r_journal_grafana_mcp);        destination(d_fluent_bit); };
