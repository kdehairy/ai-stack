name: openwebui

networks:
  ai-stack:
    external: true

services:
  openwebui:
    image: ghcr.io/open-webui/open-webui:v0.11.0
    container_name: openwebui
    restart: "no"
    volumes:
      - /data/persistence/openwebui:/app/backend/data
    ports:
      - "${OPENWEBUI_HOST}:${OPENWEBUI_PORT}:8080"
    environment:
      - OPENAI_API_BASE_URL=http://llama:8080/v1
      - OPENAI_API_KEY=none
      - CORS_ALLOW_ORIGIN=http://darwish.cloud.home
      - ENABLE_WEB_SEARCH=True
      - WEB_SEARCH_ENGINE="searxng"
      - WEB_SEARCH_RESULT_COUNT=3
      - WEB_SEARCH_CONCURRENT_REQUESTS=10
      - SEARXNG_QUERY_URL="http://searxng:8080/search?q=<query>"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - ai-stack

