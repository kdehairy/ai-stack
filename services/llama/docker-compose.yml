name: llama

networks:
  ai-stack:
    external: true

services:
  llama:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        LLAMA_VERSION: ${LLAMA_VERSION}
        AI_UID: ${AI_UID}
        AI_GID: ${AI_GID}
    image: llama-cpp-rocm:latest
    pull_policy: never
    container_name: llama
    restart: "no"
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - video
      - render
    volumes:
      - ${LLAMA_MODEL_PATH}:/data/models/llamacpp:ro
    ports:
      - "${LLAMA_HOST}:${LLAMA_PORT}:8080"
    environment:
      - ROCR_VISIBLE_DEVICES=${GPU_DEVICE_IDX}
    command: >
      --models-preset /data/models/llamacpp/models.ini
      --host 0.0.0.0
      --port 8080
      --models-max 1
      --metrics
      -fa 1
      --parallel 1
      --jinja
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - ai-stack
