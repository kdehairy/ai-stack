name: llama-embedding

networks:
  ai-stack:
    external: true

services:
  llama-embedding:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        LLAMA_VERSION: ${LLAMA_VERSION}
        AI_UID: ${AI_UID}
        AI_GID: ${AI_GID}
    image: llama-cpp-rocm:latest
    pull_policy: never
    container_name: llama-embedding
    restart: "no"
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - video
      - render
    volumes:
      - ${LLAMA_MODEL_PATH}:/data/models/llamacpp:ro
    ports:
      - "${EMBEDDING_HOST}:${EMBEDDING_PORT}:8080"
    environment:
      - ROCR_VISIBLE_DEVICES=${GPU_DEVICE_IDX}
    command: >
      --model /data/models/llamacpp/qwen-embedding/Qwen3-Embedding-4B-Q4_K_M.gguf
      --host 0.0.0.0
      --port 8080
      --metrics
      --embedding
      --pooling last
      -ub 8192
      --n-gpu-layers 0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - ai-stack
