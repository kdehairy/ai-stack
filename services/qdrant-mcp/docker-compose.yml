name: qdrant-mcp

networks:
  ai-stack:
    external: true

services:
  qdrant-mcp:
    build:
      context: ../../embedding
      dockerfile: Dockerfile
    container_name: qdrant-mcp
    restart: unless-stopped
    environment:
      TRANSPORT_MODE: http
      HTTP_PORT: 3000
      QDRANT_URL: http://qdrant:6333
      EMBEDDING_PROVIDER: openai
      EMBEDDING_BASE_URL: http://llama-embedding:8080/v1
      OPENAI_BASE_URL: http://llama-embedding:8080/v1
      EMBEDDING_MODEL: qwen3-embedding-4b
      EMBEDDING_DIMENSIONS: 2560
      OPENAI_API_KEY: dummy
      CODE_CHUNK_SIZE: 2500
      CODE_CHUNK_OVERLAP: 300
      CODE_BATCH_SIZE: 64
    ports:
      - ${QDRANT_MCP_HOST}:${QDRANT_MCP_PORT}:3000
    volumes:
      - /home/kdehairy/git_tree:/home/kdehairy/git_tree:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/mcp"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - ai-stack
