services:

  # ─── llama-embedding-server ───────────────────────────────────────────────────────────
  llama-embedding:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        LLAMA_VERSION: ${LLAMA_VERSION}
        AI_UID: ${AI_UID}
        AI_GID: ${AI_GID}
    image: llama-cpp-rocm:latest
    pull_policy: never
    container_name: llama-embedding
    restart: unless-stopped
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - video
      - render
    volumes:
      - ${LLAMA_MODEL_PATH}:/data/models/llamacpp:ro
    environment:
      - ROCR_VISIBLE_DEVICES=0
    command: >
      --model /data/models/llamacpp/qwen3-embedding-0.6b-q8_0/Qwen3-Embedding-0.6B-Q8_0.gguf
      --host 0.0.0.0
      --port 8080
      --metrics
      --embedding
      --pooling last
      -ub 8192
      --n-gpu-layers 0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    environment:
      - QDRANT__TELEMETRY_DISABLED=true
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/collections"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  qdrant-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qdrant-mcp
    restart: unless-stopped
    depends_on:
      - qdrant
      - llama-embedding
    environment:
      TRANSPORT_MODE: http
      HTTP_PORT: 3000
      QDRANT_URL: http://qdrant:6333
      EMBEDDING_PROVIDER: openai
      EMBEDDING_BASE_URL: http://llama-embedding:8080/v1
      OPENAI_BASE_URL: http://llama-embedding:8080/v1 # openai sdk is using this env variable. since it appears that this mcp server is ignoring EMBEDDING_BASE_URL
      EMBEDDING_MODEL: qwen3-embedding-0.6b
      EMBEDDING_DIMENSIONS: 1024 # the mcp sesrver does not ask the model about the dimensions it uses.
      OPENAI_API_KEY: dummy

      CODE_CHUNK_SIZE: 2500
      CODE_CHUNK_OVERLAP: 300
      CODE_BATCH_SIZE: 64
    ports:
      - 3001:3000
    volumes:
      - /home/kdehairy/git_tree:/home/kdehairy/git_tree:ro
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/mcp" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  qdrant_storage:
    driver: local
