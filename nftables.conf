#!/usr/bin/nft -f
# vim:set ts=2 sw=2 et:

#!/usr/sbin/nft -f

# Replace only this file's table. Docker's NAT/filter tables (ip nat, ip filter, created
# through iptables-nft) must survive a re-apply, or container egress breaks until Docker restarts.
destroy table inet filter

table inet filter {
    chain input {
        # Define a chain that hooks into incoming packets.
        # "priority filter" is the standard priority for filtering.
        # "policy drop" means any packet not explicitly accepted will be silently dropped.
        type filter hook input priority filter; policy drop;

        # Allow packets that belong to an already-established connection
        # or are related to one (e.g. FTP data channels, ICMP errors).
        # This is essential - without it, replies to your outgoing traffic would be blocked.
        ct state established,related accept

        # Accept all traffic on the loopback interface (lo).
        # Required for local processes to communicate with each other (e.g. 127.0.0.1).
        iif lo accept

        # Allow docker container to host traffic
        iifname "br-*" accept

        # Explicitly drop packets that the connection tracker cannot identify.
        # These are often malformed, spoofed, or part of a scan.
        ct state invalid drop

        # Allow IPv4 ICMP packets (e.g. ping) only from the local LAN (192.168.50.0/24).
        # Blocks ping from the internet while keeping it usable on your network.
        ip protocol icmp ip saddr {192.168.50.0/24,10.6.0.0/24} accept

        # Allow all ICMPv6 packets regardless of source.
        # ICMPv6 is required for IPv6 to function at all (neighbor discovery, router
        # advertisements, etc.) - blocking it would break IPv6 connectivity entirely.
        ip6 nexthdr ipv6-icmp accept

        # Allow SSH (port 22) only from the local LAN.
        # Prevents brute-force attempts and unauthorized access from the internet.
        tcp dport 22 ip saddr {192.168.50.0/24,10.6.0.0/24} accept

        # Allow plain HTTP (port 80) only from the local LAN.
        # Useful if a reverse proxy or web UI is served locally.
        tcp dport 80 ip saddr {192.168.50.0/24,10.6.0.0/24} accept

        tcp dport { 5000, 9100 } ip saddr {192.168.50.0/24,10.6.0.0/24} accept
        # Allow the monitoring stack ports from LAN only:
        #   5000 = amd gpu metrics
        #   9100 = node exporter

        # Allow HTTPS (port 443) from anywhere.
        tcp dport 443 accept

        # For every packet that reaches this point (i.e. matched nothing above),
        # log it to the kernel log (visible via journalctl -k) with the prefix
        # "nftables-drop: " so you can identify it. "flags all" includes TCP flags
        # in the log output. "counter" tracks how many packets hit this rule.
        # Finally, "drop" silently discards the packet.
        log prefix "nftables-drop: " flags all counter drop
    }

    chain output {
        # All outbound traffic is allowed unrestricted.
        type filter hook output priority filter; policy accept;
    }

    chain forward {
        type filter hook forward priority filter; policy drop;

        ct state established,related accept

        # Allow outbound traffic
        iifname "br-*" oifname "${IFACE}" accept

        # Allow return traffic back to container
        iifname "${IFACE}" oifname "br-*" ct state established,related accept

        # Allow inter-container traffic (same or different bridge networks)
        iifname "br-*" oifname "br-*" accept

        # Allow forwarding between Docker networks and host
        iifname "docker0" accept
        oifname "docker0" accept

        # Log and drop any packets that reach this point
        log prefix "nftables-drop: " flags all counter drop
    }
}
