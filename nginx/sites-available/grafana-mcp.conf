upstream grafana_mcp {
    server 127.0.0.1:3003;
}

# Server for Grafana MCP
server {
    listen 80;
    server_name ${GRAFANA_MCP_DOMAIN};

    access_log /var/log/nginx/grafana-mcp_access.json json_combined;
    error_log  /var/log/nginx/grafana-mcp_error.log;

    location / {
        proxy_pass http://grafana_mcp;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE / streaming MCP transport
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;

        add_header Access-Control-Allow-Origin  * always;
        add_header Access-Control-Expose-Headers "Mcp-Session-Id" always;
    }
}
