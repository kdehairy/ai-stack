upstream llama {
		server 127.0.0.1:8082;
}

upstream openwebui {
		server 127.0.0.1:3000;
}

upstream embedding {
		server 127.0.0.1:3001;
}

upstream searxng {
		server 127.0.0.1:8880;
}

# Primary server for OpenWebUI with CORS and WebSocket support
# Handles proxying to the OpenWebUI container while adding security headers
server {
	listen 80;
	server_name darwish.cloud.home;

	# Handles both regular API calls and WebSocket connections
	location / {
		# CORS Preflight: Handle OPTIONS requests from browsers
		# Browsers send OPTIONS requests before POST/PUT requests to check permissions
		if ($request_method = OPTIONS) {
			# Allow requests from any origin (for development/intranet)
			add_header Access-Control-Allow-Origin * always;
			# List allowed HTTP methods
			add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
			# List allowed HTTP request headers that browsers can send
			add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Forwarded-For, X-Forwarded-Host, X-Forwarded-Proto" always;
			# List headers that can be exposed in the response
			add_header Access-Control-Expose-Headers "Content-Type, Authorization" always;
			# Allow cookies and authorization headers (CORS requires special handling)
			add_header Access-Control-Allow-Credentials true always;
			# Return success response (no content) for OPTIONS requests
			return 204;
		}

		proxy_pass http://openwebui;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Forwarded-Host $host;

		# Buffer settings for large JSON responses (chat completions, embeddings)
		proxy_buffer_size 8k;
		proxy_buffers 8 8k;
		proxy_busy_buffers_size 8k;

		# WebSocket support for real-time communication
		# proxy_redirect off: Don't change redirect URLs (crucial for WebSocket)
		proxy_redirect off;
		# proxy_http_version 1.1: Required for WebSocket (HTTP/1.1 upgrades)
		proxy_http_version 1.1;
		# proxy_set_header Connection "": Clear the Connection header for proxy
		proxy_set_header Connection "";

		# CORS headers for all regular responses (POST, GET requests)
		# These headers allow browsers to read JSON responses
		add_header Access-Control-Allow-Origin * always;
		add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
		add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Forwarded-For" always;
		add_header Access-Control-Expose-Headers "Content-Type" always;
	}

	# Specialized location for WebSocket socket.io connections
	# This is separate from the main location to ensure WebSocket protocol upgrade works correctly
	location /ws/ {
		proxy_pass http://openwebui;
		
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Host $host;
		proxy_set_header X-Forwarded-Proto $scheme;

		# CORS headers for WebSocket connections
		add_header Access-Control-Allow-Origin * always;
		add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
		add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
	}

	# Health check endpoint for monitoring
	location /health {
		# Forward health request to OpenWebUI's health endpoint
		proxy_pass http://openwebui/health;
		# Allow CORS for health checks
		add_header Access-Control-Allow-Origin * always;
	}
}

# Server for llama backend (model inference server)
server {
	listen 80;
	server_name model.cloud.home;

	location / {
		proxy_pass http://llama;

		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Host $host;
		proxy_set_header X-Forwarded-Proto $scheme;

		add_header Access-Control-Allow-Origin * always;
	}
}

# Server for embedding service
server {
	listen 80;
